<!doctype html>
<html lang="es-MX">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
 <meta name="theme-color" content="#F1F2EF"/>
 <meta name="description" content="Tala Eats Restaurantes: gestiona tu negocio, pedidos, menú, cocina y activación desde un solo lugar."/>
 <meta name="apple-mobile-web-app-capable" content="yes"/>
 <meta name="apple-mobile-web-app-title" content="Tala Eats Restaurantes"/>
 <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
 <link rel="manifest" href="/manifest-restaurante.webmanifest"/>
 <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"/>
 <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
 <meta name="application-name" content="Tala Eats Restaurantes"/>
 <title>Tala Eats Restaurantes · Tu centro de operaciones</title>
 <style>
  html,body,#root{min-height:100%;margin:0}
  body{background:#F1F2EF;color:#1C1D1B;font-family:system-ui,sans-serif}
  #merchant-first-paint{position:fixed;inset:0;z-index:1000;background:#F1F2EF;color:#1C1D1B;display:grid;place-items:center}
  #merchant-first-paint>div{text-align:center}
  #merchant-first-paint strong{font-size:clamp(32px,8vw,50px);letter-spacing:-.07em;font-weight:850}
  #merchant-first-paint strong span{color:#ff7937}
  #merchant-first-paint small{display:block;margin-top:16px;font-size:11px;color:#525750;letter-spacing:.22em}
  @media(prefers-reduced-motion:no-preference){#merchant-first-paint>div{animation:merchant-appear .6s ease both}@keyframes merchant-appear{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}
 </style>
</head>
<body>
 <div id="merchant-first-paint" role="status" aria-label="Cargando Tala Eats Restaurantes">
  <div><strong>Tala <span>Eats.</span></strong><small>RESTAURANTES</small></div>
 </div>
 <div id="root"></div>
 <script type="module" src="/src/main-restaurantes.tsx"></script>
</body>
</html>
