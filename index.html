<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="Tala Eats: comercios locales, pedidos para recoger y paneles de restaurante y repartidor." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Tala Eats — Comida local, más cerca</title>
    <style id="tala-first-paint-style">
      #tala-first-paint{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:white;color:#ce3c0a;font-family:Arial,sans-serif}
      #tala-first-paint .mark{text-align:center;letter-spacing:-1px;animation:tala-brand-appear .75s ease both}
      #tala-first-paint .mark img{display:block;width:min(78vw,320px);height:auto;aspect-ratio:560 / 170}
      #tala-first-paint .slogan{position:absolute;bottom:54px;left:12px;right:12px;text-align:center;color:#777;font:400 17px Arial,sans-serif}
      @keyframes tala-brand-appear{from{opacity:.15;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
      @media(prefers-reduced-motion:reduce){#tala-first-paint .mark{animation:none}}
    </style>
  </head>
  <body>
    <div id="tala-first-paint" role="status" aria-label="Cargando Tala Eats"><div class="mark"><img src="/branding/tala-script-gradient.svg" width="320" height="97" alt="Tala Eats" /></div><div class="slogan">Pide, disfruta y repite.</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
