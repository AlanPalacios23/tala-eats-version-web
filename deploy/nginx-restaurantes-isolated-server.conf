# Public Hostname to add separately in Cloudflare:
# restaurantes-talaeats.alan-palacios-dev.com -> http://127.0.0.1:18197
# API: existing LIVE Node 127.0.0.1:18190. No staging proxy.
server {
 listen 127.0.0.1:18197;
 server_name restaurantes-talaeats.alan-palacios-dev.com;
 root /srv/talaeats-restaurantes-pwa/current;
 index index.html;
 server_tokens off;
 client_max_body_size 6m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
 add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://api.stripe.com https://*.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://*.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self' https://hooks.stripe.com; frame-ancestors 'none'" always;
 # Same-origin cookie API, shared LIVE backend. NEVER proxy to 18195, stage
 # or a newly created payments service.
 location ^~ /api/v1/ {
  proxy_pass http://127.0.0.1:18190;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
  proxy_connect_timeout 4s;
  proxy_read_timeout 35s;
  proxy_buffering off;
  proxy_no_cache 1;
  proxy_cache_bypass 1;
  add_header Cache-Control "private, no-store" always;
 }
 # A dedicated entry, not the generic three-app selector.
 location = / { return 302 /restaurante; }
 location = /restaurante { add_header Cache-Control "no-cache, no-store" always; try_files $uri /index.html; }
 location ^~ /restaurante/ { add_header Cache-Control "no-cache, no-store" always; try_files $uri /index.html; }
 # Admin activation still requires SERVER-side admin role and MFA.
 location ^~ /admin/ { add_header Cache-Control "no-cache, no-store" always; try_files $uri /index.html; }
 location = /index.html { add_header Cache-Control "no-cache, no-store" always; }
 location = /offline.html { add_header Cache-Control "no-store" always; }
 location = /sw.js { add_header Cache-Control "no-store" always; try_files $uri =404; }
 # The initial HTML manifest points at generic manifest; redirect the
 # initial browser fetch to the merchant identity on this dedicated domain.
 location = /manifest.webmanifest { return 302 /manifest-restaurante.webmanifest; }
 location = /manifest-restaurante.webmanifest {
  types { application/manifest+json webmanifest; }
  default_type application/manifest+json;
  add_header Cache-Control "no-cache, no-store" always;
  try_files $uri =404;
 }
 location ^~ /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
 location ^~ /icons/ { expires 7d; try_files $uri =404; }
 location ^~ /branding/ { expires 7d; try_files $uri =404; }
 location = /favicon.ico { try_files $uri =404; }
 # Clients, Drivers and arbitrary paths are NOT served from merchant origin.
 location / { return 404; }
}
