# Nginx process dedicated exclusively to the TALA EATS PWA.
# Managed by talaeats-web-pwa.service, NOT nginx.service.
# Only one loopback socket, defined by the included server config.
worker_processes 1;
pid /run/talaeats-web-pwa/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off;
    client_body_temp_path /tmp/talaeats-web-pwa-body;
    proxy_temp_path /tmp/talaeats-web-pwa-proxy;
    include /etc/talaeats-web-pwa/server.conf;
}
