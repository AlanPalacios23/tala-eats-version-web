# Dedicated Nginx process for TALA EATS RESTAURANTES only.
# Does not include or modify the public Clients Nginx service on 18195.
worker_processes 1;
pid /run/talaeats-restaurantes-pwa/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 sendfile on;
 access_log off;
 client_body_temp_path /tmp/talaeats-restaurantes-pwa-body;
 proxy_temp_path /tmp/talaeats-restaurantes-pwa-proxy;
 include /etc/talaeats-restaurantes-pwa/server.conf;
}
