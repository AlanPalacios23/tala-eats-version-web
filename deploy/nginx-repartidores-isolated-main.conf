# Separate Nginx process exclusively for TALA EATS REPARTIDORES (18199).
worker_processes 1;
pid /run/talaeats-repartidores-pwa/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 sendfile on;
 access_log off;
 client_body_temp_path /tmp/talaeats-repartidores-pwa-body;
 proxy_temp_path /tmp/talaeats-repartidores-pwa-proxy;
 include /etc/talaeats-repartidores-pwa/server.conf;
}
