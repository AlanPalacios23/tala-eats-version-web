# TALA EATS Web Usuarios v1.0.46 REVIEW. No public DNS/tunnel configured.
# Listen ONLY localhost:18196. Backend is EXISTING 18190, read-only.
server {
    listen 127.0.0.1:18196;
    server_name preview-web-talaeats.localhost;
    root /srv/talaeats-web-preview/current;
    index index.html;
    server_tokens off;
    client_max_body_size 32k;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # REVIEW only: Stripe scripts may render TEST elements but payment POST
    # never reaches the upstream backend; API updates also blocked in JS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://js.stripe.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://api.stripe.com https://*.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://*.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self' https://hooks.stripe.com; frame-ancestors 'none'" always;
    location ~ /\. { return 404; }
    location = /__preview_health {
        default_type text/plain;
        return 200 "TALA_EATS_PREVIEW_READ_ONLY\n";
    }
    # Only two permitted non-GET actions: login/logout of existing accounts.
    # No registration, orders, payments, wallet, driver/merchant updates.
    location = /api/v1/auth/login {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location = /api/v1/auth/logout {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location ^~ /api/v1/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
    }
    location = /sw.js { return 404; }
    location ~ ^/manifest(?:-(?:clientes|restaurante|repartidor))?\.webmanifest$ {
        default_type application/manifest+json;
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }
    location ^~ /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
