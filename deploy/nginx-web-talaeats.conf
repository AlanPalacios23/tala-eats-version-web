# Review before enabling. New PWA frontend ONLY, not a second Tala Eats backend.
# Cloudflared hostname: web-talaeats.alan-palacios-dev.com -> http://127.0.0.1:18195
# Existing talaeats.alan-palacios-dev.com -> 18190 MUST NOT be changed.
server {
    listen 127.0.0.1:18195;
    server_name web-talaeats.alan-palacios-dev.com;
    root /srv/talaeats-pwa/current;
    index index.html;
    server_tokens off;
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://api.stripe.com https://*.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://*.stripe.com; form-action 'self' https://hooks.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Route API requests to the ONE existing LIVE RC8.13 backend.
    # Keep /api/v1/... path and cookies same-origin. Never proxy to staging.
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:18190;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 35s;
        proxy_connect_timeout 4s;
        proxy_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # RC14.2 proposed: serve EXISTING legal service behind the canonical Web
    # origin rather than copying legal HTML or inventing an account deletion form.
    # This Nginx template is NOT automatically applied by static-only deploys.
    # Preserve POST/body for a legitimate deletion flow; verify CSRF, CSP,
    # redirects and browser behavior BEFORE activation on the LIVE site.
    # No changes to the old API hostname until Play URLs and mobile migrate.
    location = /privacidad {
        proxy_pass http://127.0.0.1:18191;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 4s;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }
    location = /eliminar-cuenta {
        proxy_pass http://127.0.0.1:18191;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 4s;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }

    location = /sw.js { add_header Cache-Control "no-cache, no-store, must-revalidate" always; }
    # Four standalone manifests use unique app IDs; browsers must receive JSON
    # rather than nginx's generic octet-stream fallback on old mime.types.
    location ~ ^/manifest(?:-(?:clientes|restaurante|repartidor))?\.webmanifest$ {
        default_type application/manifest+json;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location ^~ /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
