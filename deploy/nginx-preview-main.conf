# Dedicated, unprivileged Nginx for UI REVIEW only.
# Never include the server's global nginx.conf or sites-enabled.
worker_processes 1;
pid /run/talaeats-web-preview/nginx.pid;
error_log stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off;
    client_body_temp_path /tmp/talaeats-web-preview-body;
    proxy_temp_path /tmp/talaeats-web-preview-proxy;
    include /etc/talaeats-web-preview/server.conf;
}
