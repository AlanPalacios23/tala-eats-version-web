name: Repartidores Web — QA Flutter mobile
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/components/Driver*.tsx'
      - 'src/DriverStandalone.tsx'
      - 'src/main-repartidores.tsx'
      - 'repartidores.html'
      - 'vite.repartidor.config.ts'
      - 'deploy/*repartidores*'
      - 'deploy/rc138-*'
      - 'src/styles/driver*.css'
      - 'src/lib/driver-registration.ts'
      - 'src/lib/driver-presence.ts'
      - 'src/App.tsx'
      - 'tools/capture-driver-qa.mjs'
      - '.github/workflows/driver-visual-qa.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  driver-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run check
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Syntax-check independent Nginx deployment scripts
        run: |
          bash -n deploy/kali-install-repartidores-isolated.sh deploy/kali-update-repartidores-isolated.sh
          bash -n deploy/rc138-kali-build-driver-only.sh deploy/rc138-kali-driver-live-preflight.sh deploy/rc138-kali-driver-deploy.sh
      - name: Start independent Driver PWA
        run: |
          npx vite preview --config vite.repartidor.config.ts --host 127.0.0.1 --port 4173 --strictPort > /tmp/tala-driver-qa.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/repartidor > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tala-driver-qa.log
          exit 1
      - name: 4 Flutter tabs at 320,360,390,430 + plate registration
        run: node tools/capture-driver-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repartidor-flutter-parity
          path: artifacts/driver-visual/*.png
          if-no-files-found: warn
          retention-days: 14
