name: Publicar foto de tacos del onboarding

on:
  push:
    branches:
      - feat/mobile-parity-v1046-navigation
    paths:
      - tools/gh_generate_tacos_onboarding.py
      - .github/workflows/publish-tacos-onboarding.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-tacos-onboarding-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-photo:
    if: github.repository == 'AlanPalacios23/tala-eats-version-web'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-parity-v1046-navigation
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias de imagen
        run: python -m pip install --disable-pip-version-check 'numpy<3' 'opencv-python-headless==4.11.0.86' 'Pillow>=11,<13'
      - name: Verificar imagen del usuario y producir pantalla 729x1536
        run: python tools/gh_generate_tacos_onboarding.py
      - name: Registrar imagen exacta dentro de la rama
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/onboarding/comida-tu-ciudad-original-729x1536.png public/branding/onboarding-comida-tu-ciudad-729x1536.webp
          if git diff --cached --quiet; then
            echo 'TACOS_GITHUB_ASSET_ALREADY_PRESENT=PASS'
          else
            git commit -m 'assets(onboarding): version original tacos screen and clean 729x1536 WebP'
            git push origin HEAD:feat/mobile-parity-v1046-navigation
          fi
          echo 'TACOS_GITHUB_BINARY_UPLOAD=PASS'
