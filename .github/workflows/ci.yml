name: Tala Eats PWA CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Build PWA
        run: npm run build
      - name: Verify static PWA assets
        run: |
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          test -s dist/manifest-clientes.webmanifest
          test -s dist/manifest-restaurante.webmanifest
          test -s dist/manifest-repartidor.webmanifest
          test -s dist/icons/icon-192.png
          test -s dist/icons/icon-512.png
          bash -n deploy/kali-install-pwa.sh
          bash -n deploy/kali-install-pwa-isolated.sh
          bash -n deploy/kali-review-preview.sh
          bash -n deploy/kali-update-existing-public.sh
      - name: Build isolated review release
        env:
          VITE_PREVIEW_READONLY: 'true'
        run: |
          npm run build -- --outDir dist-preview
          grep -Fq 'tala-preview-mode' dist-preview/index.html
          grep -Fq 'content="read-only"' dist-preview/index.html
          test -s dist-preview/manifest-clientes.webmanifest
          test -n "$(find dist-preview/assets -maxdepth 1 -name '*.js' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: tala-eats-readonly-preview-dist
          path: dist-preview/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: tala-eats-version-web-dist
          path: dist/
          retention-days: 7
