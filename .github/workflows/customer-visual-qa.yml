name: Usuarios Web — Capturas 320–1024 px
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'tools/capture-customer-qa.mjs'
      - '.github/workflows/customer-visual-qa.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-package-lock
      - run: npm run build
      - name: Browser dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Start isolated PWA (no production API)
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/tala-visual.log 2>&1 &
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tala-visual.log
          exit 1
      - name: Synthetic visual matrix (no financial writes)
        run: node tools/capture-customer-qa.mjs
      - name: Upload comparison-ready screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usuarios-web-visual-matrix
          path: artifacts/customer-visual/*.png
          if-no-files-found: warn
          retention-days: 14
